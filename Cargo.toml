[package]
name = "io-webdav"
description = "WebDAV client and server library for Rust"
version = "0.12.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "no-std"]
keywords = ["io-free", "no-std", "coroutine", "caldav", "carddav"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-webdav/latest/io_webdav"
repository = "https://github.com/pimalaya/io-webdav"
exclude = ["/fuzz"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client", "rustls-ring"]
client = ["dep:io-http"]
server = []
std = ["client"]
rustls-ring = ["std", "client", "pimalaya-stream/rustls-ring", "dep:anyhow", "dep:pimalaya-stream"]
rustls-aws = ["std", "client", "pimalaya-stream/rustls-aws", "dep:anyhow", "dep:pimalaya-stream"]
native-tls = ["std", "client", "pimalaya-stream/native-tls", "dep:anyhow", "dep:pimalaya-stream"]
vendored = ["pimalaya-stream?/vendored"]

[[example]]
name = "list_calendars"
path = "examples/list_calendars.rs"
required-features = ["rustls-ring"]

[dev-dependencies]
env_logger = "0.11"
io-oauth = { version = "0.7", default-features = false, features = ["jwt-bearer", "rustls-ring"] }
pimalaya-stream = { version = "0.4", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
secrecy = { version = "0.10", default-features = false }
serde_json = "1"
url = { version = "2.5", default-features = false }

[dependencies]
anyhow = { version = "1", optional = true }
io-http = { version = "0.8", default-features = false, optional = true }
log = { version = "0.4", default-features = false }
memchr = { version = "2", default-features = false }
pimalaya-stream = { version = "0.4", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2", default-features = false }
url = { version = "2.5", default-features = false, features = ["serde"] }
